<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA para programar en el día a día</title>
  <!-- Prism.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
  <link rel="stylesheet" href="assets/css/prism-theme.css">

  <style>
    <!-- CSS will be injected here by build.js -->
  </style>
</head>
<body>
  <div id="presentation">
    <!-- Slides will be injected here by build.js -->
  </div>

  <div id="controls" class="controls">
    <button id="prev-btn" class="nav-btn">← Anterior</button>
    <span id="slide-counter">0 / 0</span>
    <button id="next-btn" class="nav-btn">Siguiente →</button>
  </div>

  <div id="help-overlay" class="help-overlay hidden">
    <div class="help-content">
      <h2>Controles</h2>
      <ul>
        <li><strong>→ / ←</strong> Siguiente / Anterior</li>
        <li><strong>Espacio</strong> Siguiente</li>
        <li><strong>Home / End</strong> Primera / Última</li>
        <li><strong>Enter</strong> Fullscreen</li>
        <li><strong>?</strong> Mostrar esto</li>
      </ul>
      <p>(Click para cerrar)</p>
    </div>
  </div>

  <script>
    // JS will be injected here by build.js
  </script>

  <!-- Prism.js for syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-php.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

  <script>
    // Highlight code blocks when slide changes
    const originalShowSlide = PresentationRenderer.prototype.showSlide;
    PresentationRenderer.prototype.showSlide = function(index) {
      originalShowSlide.call(this, index);
      setTimeout(() => Prism.highlightAllUnder(this.slides[this.currentSlide]), 100);
    };
  </script>
</body>
</html>
