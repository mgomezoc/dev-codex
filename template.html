<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA para programar en el día a día</title>
  <link rel="icon" href="assets/img/icono-one-card.png" type="image/png">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/enhancements.css">
  <link rel="stylesheet" href="assets/css/gsap-defaults.css">
  <link rel="stylesheet" href="assets/css/prism-theme.css">
</head>
<body>
  <div id="presentation">
    <!-- Slides will be injected here by build.js -->
  </div>

  <div id="controls" class="controls">
    <button id="prev-btn" class="nav-btn">← Anterior</button>
    <div id="slide-jump" class="slide-jump">
      <button id="slide-counter" class="slide-counter-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="slide-jump-panel">0 / 0</button>
      <form id="slide-jump-panel" class="slide-jump-panel hidden" aria-label="Cambiar slide">
        <label class="sr-only" for="slide-jump-input">Numero de slide</label>
        <input id="slide-jump-input" class="slide-jump-input" type="number" min="1" step="1" inputmode="numeric" autocomplete="off">
        <span id="slide-jump-total" class="slide-jump-total">/ 0</span>
        <button id="slide-jump-submit" class="slide-jump-submit" type="submit">Ir</button>
      </form>
    </div>
    <button id="next-btn" class="nav-btn">Siguiente →</button>
  </div>

  <div id="help-overlay" class="help-overlay hidden">
    <div class="help-content">
      <h2>Controles</h2>
      <ul>
        <li><strong>→ / ←</strong> Siguiente / Anterior</li>
        <li><strong>Espacio</strong> Siguiente</li>
        <li><strong>Home / End</strong> Primera / Última</li>
        <li><strong>Enter</strong> Fullscreen</li>
        <li><strong>?</strong> Mostrar esto</li>
      </ul>
      <p>(Click para cerrar)</p>
    </div>
  </div>

  <div id="secret-qa-modal" class="secret-qa-modal hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="secret-qa-title">
    <div class="secret-qa-backdrop" data-secret-qa-close></div>
    <section id="secret-qa-panel" class="secret-qa-panel" tabindex="-1">
      <button class="secret-qa-close" type="button" aria-label="Cerrar preguntas secretas" data-secret-qa-close>&times;</button>
      <div class="secret-qa-header">
        <h2 id="secret-qa-title">Preguntas que siempre salen</h2>
      </div>
      <div class="secret-qa-body">
        <!-- Secret robot Q&A will be injected here by build.js -->
      </div>
    </section>
  </div>

  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/js/renderer.js" defer></script>
  <script src="assets/js/keyboard.js" defer></script>
  <script src="assets/js/animations.js" defer></script>
  <script src="assets/js/robot.js" defer></script>
  <script src="assets/js/presenter-effects.js" defer></script>
</body>
</html>
